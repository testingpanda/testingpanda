version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tax
      POSTGRES_PASSWORD: tax
      POSTGRES_DB: geneva_tax_mvp
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tax -d geneva_tax_mvp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://tax:tax@db:5432/geneva_tax_mvp?schema=public
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/storage-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - storage_data:/app/storage-dev

volumes:
  db_data:
  storage_data:
